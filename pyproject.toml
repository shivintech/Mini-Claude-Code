[project]
name = "mini-calude-code"
version = "0.1.0"
description = "Building an AI agent from scratch"
readme = "README.md"
authors = [
    { name = "Shivin Gaba", email = "49929893+shivintech@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mini-calude-code = "mini_calude_code:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
